<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Jubartech — Motions</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Inter Display", "Inter", "Liberation Sans", sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';

// ---------- utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 4);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ruído de valor 3D, determinístico
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const f = a => a * a * (3 - 2 * a);
  const h = (a, b, c) => hash(a * 1.7 + b * 57.3 + c * 131.9);
  const u = f(xf), v = f(yf), w = f(zf);
  const l = (a, b, k) => a + (b - a) * k;
  return l(
    l(l(h(xi, yi, zi), h(xi + 1, yi, zi), u), l(h(xi, yi + 1, zi), h(xi + 1, yi + 1, zi), u), v),
    l(l(h(xi, yi, zi + 1), h(xi + 1, yi, zi + 1), u), l(h(xi, yi + 1, zi + 1), h(xi + 1, yi + 1, zi + 1), u), v), w);
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(s, x, y, size, weight, color, align = 'center', spacing = 0, font = FONT) {
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = spacing + 'px';
  ctx.fillText(s, x, y);
  ctx.letterSpacing = '0px';
}
function label(n, name, a) {
  ctx.save(); ctx.globalAlpha *= a;
  text(`0${n} / ${name}`, 72, 96, 26, 600, 'rgba(255,255,255,.55)', 'left', 4, MONO);
  text('JUBARTECH', W - 72, 96, 26, 700, 'rgba(255,255,255,.55)', 'right', 6);
  ctx.restore();
}

// ---------- linha do tempo ----------
const SCENES = [
  { id: 'intro', a: 0,    b: 4.2  },
  { id: 'grid',  a: 3.8,  b: 9.2  },
  { id: 'flow',  a: 8.8,  b: 14.2 },
  { id: 'brick', a: 13.8, b: 20.8 },
  { id: 'sim',   a: 20.4, b: 31.2 },
  { id: 'type',  a: 30.8, b: 35.2 },
  { id: 'dash',  a: 34.8, b: 40.2 },
  { id: 'ui',    a: 39.8, b: 45.0 },
];
const DURATION = 45.0;
const XF = 0.4;

const logo = new Image();
logo.src = '../img/logo.png';
const ready = new Promise(r => { logo.onload = r; logo.onerror = r; });

// ---------- 01 abertura ----------
function drawIntro(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0B1220'); g.addColorStop(1, '#05080F');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // brilho de fundo respirando
  const rg = ctx.createRadialGradient(W / 2, H / 2 - 60, 0, W / 2, H / 2 - 60, 760);
  rg.addColorStop(0, `rgba(36,69,216,${.28 + .05 * Math.sin(t * 2)})`);
  rg.addColorStop(1, 'rgba(36,69,216,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  // partículas lentas
  for (let i = 0; i < 70; i++) {
    const x = hash(i) * W;
    const y = ((hash(i + 50) * H - t * (20 + hash(i + 9) * 50)) % H + H) % H;
    ctx.fillStyle = `rgba(255,255,255,${.08 + hash(i + 3) * .2})`;
    ctx.beginPath(); ctx.arc(x, y, 1 + hash(i + 7) * 2.2, 0, 7); ctx.fill();
  }

  // anel desenhando
  const ring = eInOut(seg(t, .2, 1.6));
  ctx.save();
  ctx.translate(W / 2, H / 2 - 120);
  ctx.rotate(-Math.PI / 2);
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 250, 0, Math.PI * 2 * ring); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 250, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // logo
  const lk = eBack(seg(t, .9, 1.9));
  const la = eOut(seg(t, .9, 1.6));
  ctx.save();
  ctx.globalAlpha *= la;
  ctx.translate(W / 2, H / 2 - 120);
  ctx.scale(.6 + .4 * lk, .6 + .4 * lk);
  ctx.drawImage(logo, -150, -150, 300, 300);
  ctx.restore();

  // nome revelando por letra
  const name = 'JUBARTECH';
  ctx.font = `800 96px ${FONT}`; ctx.letterSpacing = '14px';
  const total = ctx.measureText(name).width; ctx.letterSpacing = '0px';
  let x = W / 2 - total / 2 + 7;
  for (let i = 0; i < name.length; i++) {
    const k = eOut(seg(t, 1.8 + i * .07, 2.4 + i * .07));
    ctx.font = `800 96px ${FONT}`;
    const cw = ctx.measureText(name[i]).width + 14;
    ctx.save();
    ctx.globalAlpha *= k;
    text(name[i], x, H / 2 + 250 + (1 - k) * 50, 96, 800, '#fff', 'left', 0);
    ctx.restore();
    x += cw;
  }
  const k2 = eOut(seg(t, 2.8, 3.5));
  ctx.save(); ctx.globalAlpha *= k2;
  text('resíduo cerâmico vira chamote', W / 2, H / 2 + 350 + (1 - k2) * 20, 34, 500, 'rgba(255,255,255,.7)', 'center', 2);
  ctx.restore();
}

// ---------- 02 partículas fluindo ----------
let flow = null;
function initFlow() {
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const c = off.getContext('2d');
  c.fillStyle = '#05080F'; c.fillRect(0, 0, W, H);
  const r = rng(7);
  const ps = Array.from({ length: 1500 }, () => ({ x: r() * W, y: r() * H, life: r() * 200 }));
  flow = { off, c, ps, r, tl: 0 };
}
function ang(x, y, t) {
  return vnoise(x * .0017, y * .0017, t * .25) * Math.PI * 4;
}
function stepFlow(t) {
  const { c, ps, r } = flow;
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = 'rgba(5,8,15,.07)'; c.fillRect(0, 0, W, H);
  c.lineWidth = 1.6;
  const warm = new Path2D();
  c.strokeStyle = 'rgba(255,255,255,.55)';
  c.beginPath();
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    const a = ang(p.x, p.y, t);
    const nx = p.x + Math.cos(a) * 5.5, ny = p.y + Math.sin(a) * 5.5;
    const path = i % 4 === 0 ? warm : null;
    if (path) { path.moveTo(p.x, p.y); path.lineTo(nx, ny); } else { c.moveTo(p.x, p.y); c.lineTo(nx, ny); }
    p.x = nx; p.y = ny; p.life++;
    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H || p.life > 260) {
      p.x = r() * W; p.y = r() * H; p.life = 0;
    }
  }
  c.stroke();
  c.strokeStyle = 'rgba(232,137,46,.75)'; c.stroke(warm);
}
function drawFlow(t, lt) {
  if (!flow) { initFlow(); for (let i = 0; i < 160; i++) stepFlow(i / FPS); }
  stepFlow(lt);
  ctx.drawImage(flow.off, 0, 0);
  const sh = ctx.createLinearGradient(0, H - 520, 0, H);
  sh.addColorStop(0, 'rgba(5,8,15,0)'); sh.addColorStop(.6, 'rgba(5,8,15,.88)'); sh.addColorStop(1, 'rgba(5,8,15,.95)');
  ctx.fillStyle = sh; ctx.fillRect(0, H - 520, W, 520);
  // título
  const k = eOut(seg(lt, .4, 1.4));
  ctx.save(); ctx.globalAlpha *= k;
  text('O QUE ERA PERDA', W / 2, H - 400 + (1 - k) * 30, 74, 800, '#fff', 'center', 4);
  text('VOLTA PARA A MASSA', W / 2, H - 310 + (1 - k) * 30, 74, 800, '#E8892E', 'center', 4);
  text('telhas e tijolos reprovados voltam à produção', W / 2, H - 220 + (1 - k) * 30, 32, 500, 'rgba(255,255,255,.75)', 'center', 1);
  ctx.restore();
}

// ---------- 03 grade 3D ----------
function drawGrid(t, lt) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04060C'); g.addColorStop(1, '#0A1226');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const f = 900, horizon = 640, camY = 8.5, camZ = -2;
  const NX = 34, NZ = 44, SX = 1.25, SZ = 1.1;
  const lx = Math.sin(lt * .9) * 9, lz = 14 + Math.cos(lt * .7) * 7;
  const wave = (x, z) =>
    Math.sin(x * .45 + lt * 1.6) * 1.1 + Math.sin(z * .38 - lt * 1.9) * 1.3 +
    Math.sin((x + z) * .22 + lt * 1.1) * .9;
  const P = (i, j) => {
    const x = (i - NX / 2) * SX, z = 2 + j * SZ;
    const y = wave(x, z);
    const zz = z - camZ;
    return { sx: W / 2 + x / zz * f, sy: horizon + (camY - y) / zz * f, z, x, y, zz };
  };
  const pts = [];
  for (let j = 0; j <= NZ; j++) { pts.push([]); for (let i = 0; i <= NX; i++) pts[j].push(P(i, j)); }

  ctx.lineWidth = 2;
  const light = p => Math.exp(-((p.x - lx) ** 2 + (p.z - lz) ** 2) / 38);
  const seg2 = (a, b) => {
    const fade = clamp(1 - (a.z - 2) / (NZ * SZ));
    const L = (light(a) + light(b)) / 2;
    const hgt = clamp((a.y + 3) / 6);
    const al = (.12 + .28 * hgt + L * .85) * (.25 + .75 * fade);
    ctx.strokeStyle = `rgba(${Math.round(90 + 165 * L)},${Math.round(130 + 120 * L)},255,${al})`;
    ctx.lineWidth = 1.3 + L * 2.6;
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  };
  for (let j = NZ; j >= 0; j--) {
    for (let i = 0; i <= NX; i++) {
      if (i < NX) seg2(pts[j][i], pts[j][i + 1]);
      if (j < NZ) seg2(pts[j][i], pts[j + 1][i]);
    }
  }
  // pontos nos vértices iluminados
  for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NX; i++) {
    const p = pts[j][i], L = light(p);
    if (L > .25) { ctx.fillStyle = `rgba(255,255,255,${L})`; ctx.beginPath(); ctx.arc(p.sx, p.sy, 2 + L * 3, 0, 7); ctx.fill(); }
  }
  // 17 olarias surgindo sobre a superfície
  for (let n = 0; n < 17; n++) {
    const i = 3 + Math.floor(hash(n + 300) * (NX - 6)), j = 3 + Math.floor(hash(n + 400) * NZ * .62);
    const p = pts[j][i];
    const k = clamp(eBack(seg(lt, 1.0 + n * .13, 1.7 + n * .13)));
    if (k <= 0) continue;
    const s = clamp(26 / p.zz * 7, 8, 44) * k;
    const pulse = 1 + .25 * Math.sin(lt * 5 + n);
    const gg = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, s * 3.4 * pulse);
    gg.addColorStop(0, 'rgba(232,137,46,.75)'); gg.addColorStop(1, 'rgba(232,137,46,0)');
    ctx.fillStyle = gg; ctx.fillRect(p.sx - s * 4, p.sy - s * 4, s * 8, s * 8);
    ctx.fillStyle = '#FFB36B'; ctx.beginPath(); ctx.arc(p.sx, p.sy, s * .55, 0, 7); ctx.fill();
  }
  // halo da luz
  const lp = P(NX / 2 + lx / SX, (lz - 2) / SZ);
  ctx.globalCompositeOperation = 'lighter';
  const rg = ctx.createRadialGradient(lp.sx, lp.sy, 0, lp.sx, lp.sy, 360);
  rg.addColorStop(0, 'rgba(120,160,255,.45)'); rg.addColorStop(1, 'rgba(120,160,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  // névoa do horizonte
  const fg = ctx.createLinearGradient(0, horizon - 260, 0, horizon + 200);
  fg.addColorStop(0, 'rgba(4,6,12,0)'); fg.addColorStop(.55, 'rgba(4,6,12,.92)'); fg.addColorStop(1, 'rgba(4,6,12,0)');
  ctx.fillStyle = fg; ctx.fillRect(0, horizon - 260, W, 460);

  const k = eOut(seg(lt, .3, 1.2));
  ctx.save(); ctx.globalAlpha *= k;
  const cnt = Math.min(17, Math.floor(Math.max(0, lt - 1.0) / .13) + 1);
  text(String(lt < 1.0 ? 0 : cnt), W / 2 - 250, 300 + (1 - k) * -30, 150, 900, '#E8892E', 'center', -4);
  text('OLARIAS', W / 2 + 120, 300 + (1 - k) * -30, 100, 800, '#fff', 'center', 6);
  text('mapeadas no APL de cerâmica vermelha do Cariri', W / 2, 410, 30, 500, 'rgba(255,255,255,.7)', 'center', 1);
  ctx.restore();
}

// ---------- 04 tipografia com glitch ----------
function drawType(t, lt) {
  ctx.fillStyle = '#05070D'; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 800);
  rg.addColorStop(0, 'rgba(36,69,216,.22)'); rg.addColorStop(1, 'rgba(36,69,216,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  const word = 'CHAMOTE';
  const size = 184;
  const cx = W / 2, cy = H / 2 - 40;
  const inK = eOut(seg(lt, .2, 1.2));
  const blur = (1 - inK) * 40;
  const fr = Math.floor(lt * FPS);
  // rajadas de glitch em instantes fixos
  const bursts = [1.6, 2.5, 3.2, 3.55];
  let gl = 0;
  for (const b of bursts) if (lt > b && lt < b + .22) gl = 1;
  const base = (dx, dy, color, comp) => {
    ctx.save();
    ctx.globalCompositeOperation = comp;
    ctx.filter = blur > .5 ? `blur(${blur}px)` : 'none';
    ctx.globalAlpha *= inK;
    text(word, cx + dx, cy + dy, size, 900, color, 'center', -4);
    ctx.restore();
  };
  const off = gl ? 10 + hash(fr) * 14 : 3 + Math.sin(lt * 3) * 2;
  base(-off, 0, 'rgba(255,40,90,1)', 'lighter');
  base(off, 0, 'rgba(0,220,255,1)', 'lighter');
  base(0, 0, '#fff', 'lighter');

  if (gl) {
    // fatias deslocadas
    const slices = 5;
    for (let s = 0; s < slices; s++) {
      const y = cy - 100 + hash(fr * 7 + s) * 200;
      const h = 6 + hash(fr * 3 + s) * 22;
      const dx = (hash(fr * 11 + s) - .5) * 80;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, y, W, h); ctx.clip();
      ctx.translate(dx, 0);
      text(word, cx, cy, size, 900, '#fff', 'center', -4);
      ctx.restore();
    }
  }
  // scanlines
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  for (let y = 0; y < H; y += 6) ctx.fillRect(0, y, W, 2);
  // barra de varredura
  const sy = ((lt * 520) % (H + 200)) - 100;
  const sg = ctx.createLinearGradient(0, sy - 60, 0, sy + 60);
  sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.05)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, sy - 60, W, 120);

  const k = eOut(seg(lt, 1, 1.8));
  ctx.save(); ctx.globalAlpha *= k;
  text('RESÍDUO CERÂMICO VIRA', W / 2, cy - 200 + (1 - k) * -24, 40, 700, 'rgba(255,255,255,.8)', 'center', 8);
  text('granulometria controlada', W / 2, cy + 190 + (1 - k) * 24, 38, 500, 'rgba(255,255,255,.75)', 'center', 3);
  text('5% na massa  ·  18 a 70 mesh', W / 2, cy + 260 + (1 - k) * 24, 30, 600, '#E8892E', 'center', 3);
  ctx.restore();
}

// ---------- 05 dashboard ----------
function drawDash(t, lt) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0C1426'); g.addColorStop(1, '#05080F');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const k0 = eOut(seg(lt, .1, 1));
  ctx.save(); ctx.globalAlpha *= k0;
  text('VIABILIDADE', W / 2, 235 + (1 - k0) * -24, 76, 800, '#fff', 'center', 8);
  text('mais barato que argila nova', W / 2, 315, 32, 500, 'rgba(255,255,255,.65)', 'center', 2);
  ctx.restore();

  const card = (x, y, w, h, a, fn) => {
    const k = eOut(seg(lt, a, a + .8));
    ctx.save();
    ctx.globalAlpha *= k;
    ctx.translate(0, (1 - k) * 60);
    rr(x, y, w, h, 40);
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2; ctx.stroke();
    fn(x, y, w, h);
    ctx.restore();
  };
  const brl = v => v.toFixed(2).replace('.', ',');

  // economia por tonelada
  card(72, 370, 936, 390, .3, (x, y, w, h) => {
    text('ECONOMIA POR TONELADA', x + 56, y + 70, 28, 700, 'rgba(255,255,255,.55)', 'left', 5);
    const n = 11.98 * eOut(seg(lt, .7, 2.6));
    text('R$ ' + brl(n), x + 56, y + 195, 150, 900, '#fff', 'left', -4);
    rr(x + 56, y + 290, 470, 56, 28); ctx.fillStyle = 'rgba(74,222,128,.18)'; ctx.fill();
    text('▼ frente à argila virgem', x + 291, y + 318, 24, 700, '#4ADE80', 'center', 0);
    // seta de queda
    const pr = eInOut(seg(lt, .9, 2.8));
    ctx.beginPath();
    const N = 30, sx = x + 650, sy = y + 90, sw = 230, sh = 200;
    for (let i = 0; i <= N * pr; i++) {
      const u = i / N, v = 1 - (1 - Math.pow(1 - u, 2.2)) * .8;
      i ? ctx.lineTo(sx + u * sw, sy + (1 - v) * sh) : ctx.moveTo(sx + u * sw, sy + (1 - v) * sh);
    }
    ctx.strokeStyle = '#E8892E'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  });

  // anel: 66% menos energia
  card(72, 810, 450, 540, 1.1, (x, y, w, h) => {
    text('POTÊNCIA', x + 40, y + 60, 26, 700, 'rgba(255,255,255,.55)', 'left', 5);
    const cx = x + w / 2, R = 140, ccy = y + 285;
    ctx.lineWidth = 34; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.1)';
    ctx.beginPath(); ctx.arc(cx, ccy, R, 0, Math.PI * 2); ctx.stroke();
    const p = .66 * eOut(seg(lt, 1.5, 3.2));
    const gr = ctx.createLinearGradient(cx - R, ccy - R, cx + R, ccy + R);
    gr.addColorStop(0, '#7D96FF'); gr.addColorStop(1, '#E8892E');
    ctx.strokeStyle = gr;
    ctx.beginPath(); ctx.arc(cx, ccy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); ctx.stroke();
    text('-' + Math.round(p * 100) + '%', cx, ccy, 78, 800, '#fff', 'center', -2);
    text('menos potência requerida', cx, y + 480, 26, 500, 'rgba(255,255,255,.6)', 'center', 1);
  });

  // barras: custo por tonelada
  card(558, 810, 450, 540, 1.3, (x, y, w, h) => {
    text('R$ / TONELADA', x + 40, y + 60, 26, 700, 'rgba(255,255,255,.55)', 'left', 5);
    const base = y + h - 130, mh = 235, bw = 130;
    [[17.5, 'Argila virgem', 'rgba(255,255,255,.35)', 'rgba(255,255,255,.12)'], [5.75, 'Eco-Moedor', '#E8892E', '#C25A35']].forEach(([v, name, c1, c2], i) => {
      const k = clamp(eBack(seg(lt, 1.7 + i * .35, 2.7 + i * .35)), 0, 1.06);
      const hh = (v / 17.5) * mh * k;
      const bx = x + 55 + i * (bw + 50);
      const gr = ctx.createLinearGradient(0, base - hh, 0, base);
      gr.addColorStop(0, c1); gr.addColorStop(1, c2);
      rr(bx, base - hh, bw, Math.max(hh, 1), 18); ctx.fillStyle = gr; ctx.fill();
      text('R$ ' + brl(v), bx + bw / 2, base - hh - 30, 34, 800, '#fff', 'center', 0);
      text(name, bx + bw / 2, base + 40, 22, 600, 'rgba(255,255,255,.6)', 'center', 0);
    });
  });

  // métricas do mercado
  card(72, 1400, 936, 250, 1.6, (x, y, w, h) => {
    const items = [['17', 'olarias mapeadas'], ['3–5%', 'de perda operacional'], ['5%', 'de chamote na massa']];
    items.forEach((it, i) => {
      const cx = x + w / 6 + i * (w / 3);

// ---------- tijolo defeituoso vira chamote ----------
const BRICK_T = [1.7, 2.3, 2.9, 3.5];             // quando cada tijolo chega aos rotores
const OUTX = 540, OUTY = 1205, BASE = 1690, PILE_W = 250, PILE_H = 270, NG = 280, GRAV = 1400;
const prof = x => Math.exp(-Math.pow((x - 540) / (PILE_W * .62), 2));
const GRAINS = [];
for (let e = 0; e < 4; e++) for (let g = 0; g < NG / 4; g++) {
  const id = e * (NG / 4) + g;
  const x1 = 540 + (hash(id + 900) - .5) * 2 * PILE_W * .85;
  const landY = BASE - PILE_H * prof(x1) * clamp((id + 1) / NG) * .9;
  const spawn = BRICK_T[e] + .9 + hash(id + 1300) * .7;
  const dur = Math.sqrt(2 * Math.max(landY - OUTY, 40) / GRAV);
  GRAINS.push({ x0: OUTX + (hash(id + 1700) - .5) * 60, x1, landY, spawn, dur, r: 2.5 + hash(id + 2100) * 3.2, c: hash(id + 2500) });
}
const CHAMOTE = ['#E8B27C', '#D99A62', '#C98650', '#F0C594', '#B8743F'];

function brickShape(w, h, seed) {
  const P = [[-w/2+8,-h/2],[w/2-46,-h/2],[w/2-30,-h/2+14],[w/2-12,-h/2+8],[w/2,-h/2+30],[w/2,h/2-8],[w/2-8,h/2],[-w/2+30,h/2],[-w/2+14,h/2-16],[-w/2+2,h/2-10],[-w/2,-h/2+8]];
  ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, '#D8703F'); g.addColorStop(1, '#A44629');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#6E2D1B'; ctx.lineWidth = 4; ctx.stroke();
  // furos do tijolo
  ctx.fillStyle = 'rgba(80,28,14,.55)';
  for (let i = 0; i < 3; i++) { rr(-w / 2 + 34 + i * (w - 68) / 3, -h * .22, (w - 68) / 3 - 14, h * .44, 8); ctx.fill(); }
  // trincas
  ctx.strokeStyle = '#2E100A'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  const cx0 = (hash(seed) - .5) * w * .3;
  ctx.beginPath(); ctx.moveTo(cx0, -h / 2); ctx.lineTo(cx0 + 12, -h * .2); ctx.lineTo(cx0 - 10, h * .05); ctx.lineTo(cx0 + 14, h * .28); ctx.lineTo(cx0 + 2, h / 2); ctx.stroke();
  ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx0 + 12, -h * .2); ctx.lineTo(cx0 + 44, -h * .12); ctx.lineTo(cx0 + 60, h * .02); ctx.stroke();
}
function roller(cx, cy, ang) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
  for (let i = 0; i < 10; i++) {
    ctx.save(); ctx.rotate(i * Math.PI / 5);
    ctx.fillStyle = i % 2 ? '#F2B33D' : '#2445D8';
    rr(-11, -66, 22, 44, 5); ctx.fill();
    ctx.restore();
  }
  const g = ctx.createRadialGradient(-10, -10, 4, 0, 0, 44);
  g.addColorStop(0, '#C4CCD8'); g.addColorStop(1, '#5B6678');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 44, 0, 7); ctx.fill();
  ctx.fillStyle = '#2A3342'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill();
  ctx.restore();
}

function drawBrick(t, lt) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0D1424'); g.addColorStop(1, '#070A12');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(540, 1000, 0, 540, 1000, 800);
  rg.addColorStop(0, 'rgba(194,90,53,.20)'); rg.addColorStop(1, 'rgba(194,90,53,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

  // tremor quando um tijolo é esmagado
  let sx = 0, sy = 0;
  BRICK_T.forEach((T, e) => { const dt = lt - T; if (dt > 0 && dt < .25) { const am = 9 * (1 - dt / .25); sx += (hash(Math.floor(lt * 60) + e) - .5) * 2 * am; sy += (hash(Math.floor(lt * 60) + e + 9) - .5) * 2 * am; } });
  ctx.save(); ctx.translate(sx, sy);

  // funil (fundo)
  ctx.beginPath(); ctx.moveTo(180, 560); ctx.lineTo(900, 560); ctx.lineTo(690, 820); ctx.lineTo(390, 820); ctx.closePath();
  ctx.fillStyle = '#18202E'; ctx.fill();
  // câmara + rotores
  ctx.fillStyle = '#0B0F18'; ctx.fillRect(350, 820, 380, 220);
  roller(455, 945, lt * 3.4); roller(625, 945, -lt * 3.4);

  // tijolos
  BRICK_T.forEach((T, i) => {
    const appear = eBack(seg(lt, .3 + i * .15, .9 + i * .15));
    if (appear <= 0 || lt >= T) return;
    const tf = T - 1.0, kf = seg(lt, tf, T);
    const x0 = 540 + (i - 1.5) * 240, y0 = 470;
    const x = lerp(x0, 540 + (i - 1.5) * 12, eInOut(kf));
    const y = lerp(y0, 866, kf * kf);
    const rot = lerp((hash(i + 20) - .5) * .34, (i % 2 ? .08 : -.08), kf);
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(appear, appear);
    brickShape(190, 92, i + 5);
    // carimbo
    const sk = eOut(seg(lt, .9 + i * .15, 1.15 + i * .15));
    if (sk > 0) {
      ctx.save(); ctx.rotate(-.17); ctx.scale(1.7 - .7 * sk, 1.7 - .7 * sk); ctx.globalAlpha *= sk;
      rr(-82, -17, 164, 34, 6); ctx.strokeStyle = '#FF5C5C'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = 'rgba(40,10,10,.35)'; ctx.fill();
      text('REPROVADO', 0, 1, 20, 800, '#FF6B6B', 'center', 2);
      ctx.restore();
    }
    ctx.restore();
  });

  // paredes do funil (frente) e borda
  ctx.fillStyle = '#566179';
  ctx.beginPath(); ctx.moveTo(150, 550); ctx.lineTo(210, 550); ctx.lineTo(430, 820); ctx.lineTo(360, 820); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(930, 550); ctx.lineTo(870, 550); ctx.lineTo(650, 820); ctx.lineTo(720, 820); ctx.closePath(); ctx.fill();
  rr(140, 538, 800, 20, 8); ctx.fillStyle = '#7A869E'; ctx.fill();
  // estrutura da câmara
  ctx.fillStyle = '#3C4658';
  ctx.fillRect(320, 810, 40, 250); ctx.fillRect(720, 810, 40, 250); ctx.fillRect(320, 800, 440, 24); ctx.fillRect(320, 1030, 440, 28);
  ctx.fillStyle = '#7A869E';
  [[340, 835], [340, 1000], [740, 835], [740, 1000]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); });
  // motor
  const mg = ctx.createLinearGradient(0, 900, 0, 1000);
  mg.addColorStop(0, '#4D6BF0'); mg.addColorStop(1, '#1B33A8');
  rr(150, 900, 170, 100, 14); ctx.fillStyle = mg; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; for (let i = 0; i < 5; i++) ctx.fillRect(170 + i * 28, 912, 6, 76);
  // calha verde
  const cg = ctx.createLinearGradient(0, 1058, 0, 1205);
  cg.addColorStop(0, '#3E9B5A'); cg.addColorStop(1, '#2A7442');
  ctx.beginPath(); ctx.moveTo(340, 1058); ctx.lineTo(740, 1058); ctx.lineTo(600, 1205); ctx.lineTo(480, 1205); ctx.closePath(); ctx.fillStyle = cg; ctx.fill();

  // poeira e fragmentos de cada esmagamento
  BRICK_T.forEach((T, e) => {
    const dt = lt - T;
    if (dt > 0 && dt < .7) {
      ctx.fillStyle = `rgba(232,160,110,${.32 * (1 - dt / .7)})`;
      ctx.beginPath(); ctx.arc(540, 880, 30 + dt * 260, 0, 7); ctx.fill();
    }
    if (dt <= 0 || dt > 1.4) return;
    for (let f = 0; f < 14; f++) {
      const id = e * 40 + f;
      const k = clamp(dt / .75);
      const x0 = 540 + (hash(id) - .5) * 130;
      const x = x0 + (hash(id + 100) - .5) * 40 * dt - (x0 - 540) * k * .85;
      const y = 880 + 120 * dt + 520 * dt * dt;
      const sz = (14 + hash(id + 200) * 22) * (1 - .72 * k);
      const al = 1 - seg(dt, .75, 1.05);
      if (al <= 0) continue;
      ctx.save(); ctx.globalAlpha *= al; ctx.translate(x, y); ctx.rotate(hash(id + 300) * 6 + dt * 9);
      ctx.fillStyle = k < .5 ? '#C25A35' : '#D99A62';
      ctx.beginPath(); ctx.moveTo(-sz, -sz * .4); ctx.lineTo(sz * .8, -sz * .6); ctx.lineTo(sz * .5, sz * .6); ctx.lineTo(-sz * .6, sz * .5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  });

  // grãos caindo e pilha de chamote
  let landed = 0;
  for (const gr of GRAINS) if (lt >= gr.spawn + gr.dur) landed++;
  const frac = landed / NG, ph = Math.pow(frac, .85);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(540, BASE + 14, PILE_W * 1.5, 22, 0, 0, 7); ctx.fill();
  if (ph > .005) {
    ctx.beginPath(); ctx.moveTo(540 - PILE_W * 1.5, BASE);
    for (let x = 540 - PILE_W * 1.5; x <= 540 + PILE_W * 1.5; x += 6) ctx.lineTo(x, BASE - PILE_H * prof(x) * ph);
    ctx.lineTo(540 + PILE_W * 1.5, BASE); ctx.closePath();
    const pg = ctx.createLinearGradient(0, BASE - PILE_H, 0, BASE);
    pg.addColorStop(0, '#E8B27C'); pg.addColorStop(1, '#A8663A');
    ctx.fillStyle = pg; ctx.fill();
    for (let i = 0; i < 1100; i++) {
      const px = 540 + (hash(i + 4000) - .5) * 2 * PILE_W * 1.35;
      const hh = PILE_H * prof(px) * ph;
      if (hh < 4) continue;
      ctx.fillStyle = CHAMOTE[Math.floor(hash(i + 5000) * CHAMOTE.length)];
      const py = BASE - hash(i + 6000) * hh;
      ctx.beginPath(); ctx.arc(px, py, 1.4 + hash(i + 7000) * 2.4, 0, 7); ctx.fill();
    }
  }
  for (const gr of GRAINS) {
    const dt = lt - gr.spawn;
    if (dt < 0 || dt >= gr.dur) continue;
    const k = dt / gr.dur;
    const x = lerp(gr.x0, gr.x1, k), y = OUTY + .5 * GRAV * dt * dt;
    ctx.fillStyle = CHAMOTE[Math.floor(gr.c * CHAMOTE.length)];
    ctx.beginPath(); ctx.arc(x, y, gr.r, 0, 7); ctx.fill();
  }
  ctx.restore();

  // textos
  const k0 = eOut(seg(lt, .1, .9));
  ctx.save(); ctx.globalAlpha *= k0;
  text('TIJOLO DEFEITUOSO', W / 2, 200 + (1 - k0) * -24, 72, 800, '#fff', 'center', 4);
  ctx.restore();
  const k1 = eOut(seg(lt, 4.0, 4.9));
  ctx.save(); ctx.globalAlpha *= k1;
  text('VIRA CHAMOTE', W / 2, 295 + (1 - k1) * 20, 72, 800, '#E8892E', 'center', 4);
  ctx.restore();
  const k2 = eOut(seg(lt, 5.2, 6.1));
  ctx.save(); ctx.globalAlpha *= k2;
  text('granulometria controlada', W / 2, 1782 + (1 - k2) * 16, 38, 600, '#fff', 'center', 3);
  text('5% na massa aumenta a resistência após a queima', W / 2, 1845 + (1 - k2) * 16, 28, 500, 'rgba(255,255,255,.7)', 'center', 1);
  ctx.restore();
}

    const on = lt >= a && lt < b;
    const past = lt >= b;
    const k = eOut(seg(lt, .8 + i * .15, 1.5 + i * .15));
    ctx.save(); ctx.globalAlpha *= k;
    ctx.translate((1 - k) * 40, 0);
    rr(72, y - 44, 936, 88, 28);
    ctx.fillStyle = on ? 'rgba(232,137,46,.16)' : 'rgba(255,255,255,.05)'; ctx.fill();
    ctx.strokeStyle = on ? '#E8892E' : 'rgba(255,255,255,.1)'; ctx.lineWidth = on ? 3 : 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(130, y, 28, 0, 7);
    ctx.fillStyle = on ? '#E8892E' : past ? 'rgba(232,137,46,.5)' : 'rgba(255,255,255,.12)'; ctx.fill();
    text(past ? '✓' : String(i + 1), 130, y + 1, 30, 800, on || past ? '#0F1730' : 'rgba(255,255,255,.6)', 'center', 0);
    text(label, 184, y + 1, 33, on ? 700 : 500, on ? '#fff' : 'rgba(255,255,255,.6)', 'left', 0);
    ctx.restore();
  });
  const fk = eOut(seg(lt, 1.6, 2.4));
  ctx.save(); ctx.globalAlpha *= fk;
  text('TRL 3→4  ·  patente em depósito', W / 2, 1760, 30, 700, '#E8892E', 'center', 3);
  text('com apoio do Instituto SENAI de Tecnologia', W / 2, 1815, 26, 500, 'rgba(255,255,255,.6)', 'center', 1);
  ctx.restore();
}

// ---------- compositor ----------
const draw = { intro: drawIntro, grid: drawGrid, flow: drawFlow, brick: drawBrick, sim: drawSim, type: drawType, dash: drawDash, ui: drawUI };
const sceneIdx = { intro: 1, grid: 2, flow: 3, brick: 4, sim: 5, type: 6, dash: 7, ui: 8 };
const names = { grid: 'MERCADO', flow: 'REAPROVEITAMENTO', brick: 'TRANSFORMAÇÃO', sim: 'PROTÓTIPO', type: 'CHAMOTE', dash: 'VIABILIDADE', ui: 'TECNOLOGIA' };

function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  SCENES.forEach((s, i) => {
    if (t < s.a || t > s.b) return;
    const lt = t - s.a;
    const aIn = i === 0 ? 1 : seg(t, s.a, s.a + XF);
    const aOut = i === SCENES.length - 1 ? 1 : 1 - seg(t, s.b - XF, s.b);
    ctx.save();
    ctx.globalAlpha = aIn; // a cena anterior continua desenhada por baixo
    draw[s.id](t, lt);
    if (s.id !== 'intro') label(sceneIdx[s.id], names[s.id], 1);
    ctx.restore();
  });
  // fade final
  const fo = seg(t, DURATION - .5, DURATION);
  if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.__ready = ready;
window.renderAt = renderAt;
window.prepare = async t => {
  const s = SCENES.find(s => s.id === 'sim');
  if (t >= s.a && t <= s.b) await loadSim(simFrame(t - s.a));
};
window.DURATION = DURATION;
window.FPS = FPS;
renderAt(0);
</script>
